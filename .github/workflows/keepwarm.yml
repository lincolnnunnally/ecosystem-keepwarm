name: keep-warm
# Pings the free-tier Render backends so real users never hit a ~50s cold start.
# Free (public repo = unlimited Actions). Reversible: delete this repo/workflow.
on:
  schedule:
    - cron: '*/10 * * * *'   # every ~10 min (UTC, best-effort); Render spins down at 15 min idle
  workflow_dispatch:          # allow manual run for verification
# GitHub switches off scheduled workflows in public repos after 60 days with no
# commits (this happened 2026-09-09: pings silently stopped for ~2 months).
# The stay-enabled job re-enables this workflow via the API, which resets that
# 60-day clock. actions: write is needed for that call; nothing else is granted.
permissions:
  actions: write
  contents: read
jobs:
  stay-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable this workflow (resets GitHub's 60-day inactivity timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepwarm.yml/enable" && echo "re-enabled"

  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backends
        run: |
          set +e
          urls=(
            "https://laser-engrave-api.onrender.com/api/health"
            "https://kindred-api-5d9v.onrender.com/api/health"
            "https://aligned-souls-api.onrender.com/api/health"
            "https://api.churchconnect.cloud/api/health"
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -m 90 -o /dev/null -w "%{http_code}" "$u")
            echo "$u -> $code"
          done
          echo "keep-warm ping complete"
